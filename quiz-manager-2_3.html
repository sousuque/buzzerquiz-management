<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>早押しクイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #12162a;
  --panel: #1b2140;
  --panel-alt: #212849;
  --border: #2c3358;
  --red: #e8484b;
  --red-dark: #c93638;
  --gold: #f0b429;
  --text: #f3f1ea;
  --muted: #8b93b8;
}
* { box-sizing: border-box; }
body { margin: 0; }

.qm-app {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: 'Yusei Magic', sans-serif;
  padding: 32px 16px 64px;
}
.qm-wrap { max-width: 880px; margin: 0 auto; }

.qm-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.qm-title {
  font-family: 'Yusei Magic', sans-serif;
  font-weight: 400;
  font-size: 26px;
  margin: 0;
  letter-spacing: 0.02em;
}
.qm-tabs { display: flex; gap: 14px; }

.qm-buzzer {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 13px 24px;
  border-radius: 999px;
  font-family: 'Yusei Magic', sans-serif;
  font-size: 14px;
  color: var(--muted);
  background: var(--panel);
  border: none;
  border-bottom: 4px solid var(--border);
  cursor: pointer;
  transition: all 0.15s ease;
}
.qm-buzzer:hover { color: var(--text); }
.qm-buzzer:active { transform: translateY(2px); border-bottom-width: 2px; }
.qm-buzzer.active {
  background: var(--red);
  color: #fff;
  border-bottom-color: var(--red-dark);
  box-shadow: 0 0 22px rgba(232, 72, 75, 0.4);
}
.qm-buzzer:focus-visible,
.qm-btn:focus-visible,
.qm-icon-btn:focus-visible,
.qm-input:focus-visible,
.qm-textarea:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}

.qm-status {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 10px;
  margin-bottom: 16px;
  font-size: 13px;
}
.qm-status-body { display: flex; align-items: center; gap: 8px; }
.qm-status.success { background: rgba(240, 180, 41, 0.12); border: 1px solid var(--gold); color: var(--gold); }
.qm-status.error { background: rgba(232, 72, 75, 0.12); border: 1px solid var(--red); color: #ff8385; }
.qm-status-close { background: none; border: none; color: inherit; cursor: pointer; display: flex; }

.qm-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px 20px;
  margin-bottom: 8px;
}
.qm-hint { font-size: 12px; color: var(--muted); margin: 0 0 24px 4px; }

.qm-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--panel-alt);
  color: var(--text);
  font-size: 14px;
  font-family: 'Yusei Magic', sans-serif;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
  white-space: nowrap;
}
.qm-btn:hover { border-color: var(--gold); }
.qm-btn-primary { background: var(--red); border-color: var(--red-dark); color: #fff; }
.qm-btn-primary:hover { background: var(--red-dark); border-color: var(--red-dark); }
.qm-btn-block { width: 100%; justify-content: center; margin-top: 4px; }

.qm-export-group { display: flex; align-items: center; gap: 6px; }
.qm-filename-input {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 10px;
  color: var(--text);
  font-size: 13px;
  width: 130px;
  font-family: 'Yusei Magic', sans-serif;
}
.qm-ext { color: var(--muted); font-size: 13px; }
.qm-count { margin-left: auto; font-size: 13px; color: var(--muted); }

.qm-search-wrap { position: relative; margin-bottom: 20px; }
.qm-search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.qm-search-input { padding-left: 38px; }

.qm-input, .qm-textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  color: var(--text);
  font-size: 15px;
  font-family: 'Yusei Magic', sans-serif;
}
.qm-textarea { resize: vertical; line-height: 1.6; }
.qm-input:focus, .qm-textarea:focus, .qm-filename-input:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(240, 180, 41, 0.15);
}

.qm-field { margin-bottom: 16px; }
.qm-label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 700; }

.qm-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }

.qm-empty { text-align: center; padding: 56px 20px; color: var(--muted); }
.qm-empty-title { font-family: 'Yusei Magic', sans-serif; font-size: 19px; color: var(--text); margin-bottom: 8px; }
.qm-empty p { margin: 0 0 20px; font-size: 14px; }
.qm-empty-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

.qm-rows { display: flex; flex-direction: column; gap: 12px; }
.qm-row {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  display: flex;
  gap: 14px;
  align-items: flex-start;
}
.qm-num {
  flex-shrink: 0;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--panel-alt);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
}
.qm-row-content { flex: 1; min-width: 0; }
.qm-q-text { font-size: 15px; line-height: 1.7; margin-bottom: 8px; word-break: break-word; white-space: pre-wrap; }
.qm-a-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(240, 180, 41, 0.12);
  color: var(--gold);
  border: 1px solid rgba(240, 180, 41, 0.4);
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 13px;
  font-weight: 700;
  word-break: break-word;
}
.qm-row-actions { display: flex; gap: 8px; flex-shrink: 0; }

.qm-icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--panel-alt);
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: border-color 0.15s ease, color 0.15s ease;
}
.qm-icon-btn:hover { color: var(--text); border-color: var(--gold); }
.qm-icon-btn.danger:hover { color: #ff8385; border-color: var(--red); }
.qm-icon-btn-sm { width: 26px; height: 26px; }

.qm-badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.qm-genre-badge {
  display: inline-flex;
  align-items: center;
  background: var(--panel-alt);
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 700;
  word-break: break-word;
}
.qm-status-badge {
  display: inline-flex;
  align-items: center;
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 700;
  border: 1px solid transparent;
}
.qm-status-badge.progress { background: rgba(139, 147, 184, 0.14); color: var(--muted); border-color: rgba(139, 147, 184, 0.4); }
.qm-status-badge.checking { background: rgba(232, 151, 75, 0.14); color: #e8974b; border-color: rgba(232, 151, 75, 0.4); }
.qm-status-badge.done { background: rgba(76, 175, 125, 0.14); color: #4caf7d; border-color: rgba(76, 175, 125, 0.4); }

.qm-field-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.qm-field-row .qm-field { flex: 1; min-width: 140px; margin-bottom: 0; }

.qm-filter-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
.qm-filter-row .qm-search-wrap { flex: 2; min-width: 200px; margin-bottom: 0; }
.qm-filter-select { flex: 1; min-width: 140px; cursor: pointer; }

.qm-preview { margin-top: 28px; }
.qm-preview-title { font-size: 12px; color: var(--muted); margin-bottom: 10px; font-weight: 700; }
.qm-preview-row { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--border); font-size: 13px; }
.qm-preview-row:last-child { border-bottom: none; }
.qm-preview-num { color: var(--muted); flex-shrink: 0; width: 20px; }
.qm-preview-q { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qm-preview-a { color: var(--gold); flex-shrink: 0; max-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.qm-modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 20px;
}
.qm-modal { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 24px; max-width: 360px; width: 100%; }
.qm-modal-title { font-family: 'Yusei Magic', sans-serif; font-size: 16px; margin-bottom: 10px; }
.qm-modal-text { font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.6; }
.qm-modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

.qm-hidden { display: none !important; }

.qm-drop-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(18, 22, 42, 0.85);
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  padding: 20px;
}
.qm-drop-message {
  font-family: 'Yusei Magic', sans-serif;
  font-size: 20px;
  text-align: center;
  color: var(--gold);
  border: 3px dashed var(--gold);
  border-radius: 20px;
  padding: 40px 50px;
  max-width: 90%;
}
.qm-drop-message span {
  font-family: 'Yusei Magic', sans-serif;
  font-size: 13px;
  color: var(--muted);
  display: block;
  margin-top: 12px;
}

@media (max-width: 600px) {
  .qm-header { flex-direction: column; align-items: flex-start; }
  .qm-tabs { width: 100%; }
  .qm-buzzer { flex: 1; justify-content: center; }
  .qm-row { flex-direction: column; }
  .qm-row-actions { width: 100%; justify-content: flex-end; }
  .qm-count { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
<div class="qm-app">
  <div class="qm-wrap">
    <div class="qm-header">
      <h1 class="qm-title">早押しクイズ</h1>
      <div class="qm-tabs" role="tablist">
        <button id="tab-list-btn" class="qm-buzzer active" type="button">☰ クイズ一覧</button>
        <button id="tab-create-btn" class="qm-buzzer" type="button">✎ 作成</button>
      </div>
    </div>

    <div id="status-area"></div>

    <div class="qm-toolbar">
      <button id="load-btn" class="qm-btn" type="button">⭱ CSVを読み込む</button>
      <button id="new-btn" class="qm-btn" type="button">＋ 新規作成</button>
      <div class="qm-export-group">
        <input id="filename-input" class="qm-filename-input" value="quiz" aria-label="ファイル名" />
        <span class="qm-ext">.csv</span>
        <button id="export-btn" class="qm-btn qm-btn-primary" type="button">⭳ 保存</button>
      </div>
      <span id="count-span" class="qm-count">0問</span>
    </div>
    <p class="qm-hint">CSVは「question, answer, genre, status」の列に対応しています（1行目は見出し行でも可、genre・statusは省略可）。複数のCSVファイルを選択、またはドラッグ＆ドロップすると、まとめて1つに統合されます。</p>
    <input type="file" id="file-input" accept=".csv" class="qm-hidden" multiple />

    <div id="panel-list">
      <div class="qm-filter-row">
        <div class="qm-search-wrap">
          <span class="qm-search-icon">🔍</span>
          <input id="search-input" class="qm-input qm-search-input" placeholder="問題・答えで検索" />
        </div>
        <select id="genre-filter" class="qm-input qm-filter-select" aria-label="ジャンルで絞り込み">
          <option value="">ジャンル: すべて</option>
        </select>
        <select id="status-filter" class="qm-input qm-filter-select" aria-label="ステータスで絞り込み">
          <option value="">ステータス: すべて</option>
          <option value="作成途中">作成途中</option>
          <option value="裏取り中">裏取り中</option>
          <option value="完成">完成</option>
        </select>
      </div>
      <div id="list-rows"></div>
    </div>

    <div id="panel-create" class="qm-hidden">
      <div class="qm-card">
        <form id="add-form">
          <div class="qm-field">
            <label class="qm-label" for="form-question">問題文</label>
            <textarea id="form-question" class="qm-textarea" rows="4" placeholder="例: 日本で一番高い山は？"></textarea>
          </div>
          <div class="qm-field" style="margin-bottom:16px;">
            <label class="qm-label" for="form-answer">答え</label>
            <input id="form-answer" class="qm-input" placeholder="例: 富士山" />
          </div>
          <div class="qm-field-row">
            <div class="qm-field">
              <label class="qm-label" for="form-genre">ジャンル</label>
              <input id="form-genre" class="qm-input" list="genre-datalist" placeholder="例: 歴史" />
            </div>
            <div class="qm-field">
              <label class="qm-label" for="form-status">ステータス</label>
              <select id="form-status" class="qm-input">
                <option value="作成途中">作成途中</option>
                <option value="裏取り中">裏取り中</option>
                <option value="完成">完成</option>
              </select>
            </div>
          </div>
          <datalist id="genre-datalist"></datalist>
          <button type="submit" class="qm-btn qm-btn-primary qm-btn-block">＋ 追加する</button>
        </form>
      </div>
      <div id="create-preview"></div>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="drop-overlay" class="qm-drop-overlay qm-hidden">
    <div class="qm-drop-message">📂 ここにCSVファイルをドロップ<span>複数ファイルはまとめて1つに統合されます</span></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'quiz-manager-data-v1';
  var QUESTION_TOKENS = ['question', '問題', '問題文', 'q'];
  var ANSWER_TOKENS = ['answer', '答え', '解答', 'a'];
  var GENRE_TOKENS = ['genre', 'category', 'ジャンル', 'カテゴリ', '分類'];
  var STATUS_TOKENS = ['status', 'ステータス', '状態'];
  var STATUS_OPTIONS = ['作成途中', '裏取り中', '完成'];

  var state = {
    activeTab: 'list',
    quizzes: [],
    editingId: null,
    confirmAction: null,
    status: null
  };

  var el = {
    tabListBtn: document.getElementById('tab-list-btn'),
    tabCreateBtn: document.getElementById('tab-create-btn'),
    statusArea: document.getElementById('status-area'),
    loadBtn: document.getElementById('load-btn'),
    newBtn: document.getElementById('new-btn'),
    filenameInput: document.getElementById('filename-input'),
    exportBtn: document.getElementById('export-btn'),
    countSpan: document.getElementById('count-span'),
    fileInput: document.getElementById('file-input'),
    panelList: document.getElementById('panel-list'),
    panelCreate: document.getElementById('panel-create'),
    searchInput: document.getElementById('search-input'),
    genreFilter: document.getElementById('genre-filter'),
    statusFilter: document.getElementById('status-filter'),
    listRows: document.getElementById('list-rows'),
    addForm: document.getElementById('add-form'),
    formQuestion: document.getElementById('form-question'),
    formAnswer: document.getElementById('form-answer'),
    formGenre: document.getElementById('form-genre'),
    formStatus: document.getElementById('form-status'),
    genreDatalist: document.getElementById('genre-datalist'),
    createPreview: document.getElementById('create-preview'),
    modalRoot: document.getElementById('modal-root'),
    dropOverlay: document.getElementById('drop-overlay')
  };

  var statusTimer = null;

  function genId() {
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // ---- persistence ----
  function loadFromStorage() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) state.quizzes = parsed;
      }
    } catch (e) {
      // localStorage unavailable or no saved data — start empty, that's fine
    }
  }
  function saveToStorage() {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state.quizzes));
    } catch (e) {
      // ignore autosave failures (e.g. storage disabled)
    }
  }

  // ---- CSV parse / unparse (no external library needed) ----
  function parseCSV(text) {
    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (inQuotes) {
        if (ch === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else { inQuotes = false; }
        } else {
          field += ch;
        }
      } else if (ch === '"') {
        inQuotes = true;
      } else if (ch === ',') {
        row.push(field); field = '';
      } else if (ch === '\n') {
        row.push(field); rows.push(row); row = []; field = '';
      } else if (ch === '\r') {
        // skip; \n handles line breaks
      } else {
        field += ch;
      }
    }
    if (field.length > 0 || row.length > 0) {
      row.push(field);
      rows.push(row);
    }
    return rows.filter(function (r) { return !(r.length === 1 && r[0].trim() === ''); });
  }

  function unparseCSV(rows) {
    return rows.map(function (row) {
      return row.map(function (field) {
        var s = String(field == null ? '' : field);
        if (/[",\n\r]/.test(s)) {
          return '"' + s.replace(/"/g, '""') + '"';
        }
        return s;
      }).join(',');
    }).join('\r\n');
  }

  // ---- status banner ----
  function showStatus(type, text) {
    state.status = { type: type, text: text };
    renderStatus();
    if (statusTimer) clearTimeout(statusTimer);
    statusTimer = setTimeout(function () {
      state.status = null;
      renderStatus();
    }, 3200);
  }
  function renderStatus() {
    if (!state.status) { el.statusArea.innerHTML = ''; return; }
    var icon = state.status.type === 'success' ? '✓' : '!';
    el.statusArea.innerHTML =
      '<div class="qm-status ' + state.status.type + '">' +
      '<span class="qm-status-body">' + icon + ' ' + escapeHtml(state.status.text) + '</span>' +
      '<button class="qm-status-close" type="button" data-action="close-status">✕</button>' +
      '</div>';
  }

  // ---- tabs ----
  function setActiveTab(tab) {
    state.activeTab = tab;
    renderTabs();
  }
  function renderTabs() {
    var isList = state.activeTab === 'list';
    el.tabListBtn.classList.toggle('active', isList);
    el.tabCreateBtn.classList.toggle('active', !isList);
    el.panelList.classList.toggle('qm-hidden', !isList);
    el.panelCreate.classList.toggle('qm-hidden', isList);
  }

  // ---- toolbar count ----
  function renderCount() {
    el.countSpan.textContent = state.quizzes.length + '問';
  }

  // ---- rows (list tab) ----
  function statusClass(status) {
    if (status === '裏取り中') return 'checking';
    if (status === '完成') return 'done';
    return 'progress';
  }

  function getFiltered() {
    var term = el.searchInput.value.trim().toLowerCase();
    var genre = el.genreFilter.value;
    var status = el.statusFilter.value;
    return state.quizzes.filter(function (q) {
      if (term && q.question.toLowerCase().indexOf(term) === -1 && q.answer.toLowerCase().indexOf(term) === -1) return false;
      if (genre && (q.genre || '') !== genre) return false;
      if (status && (q.status || STATUS_OPTIONS[0]) !== status) return false;
      return true;
    });
  }

  // keeps the genre datalist (create form) and genre filter (list tab) in sync with actual data
  function renderGenreOptions() {
    var genres = [];
    state.quizzes.forEach(function (q) {
      var g = (q.genre || '').trim();
      if (g && genres.indexOf(g) === -1) genres.push(g);
    });
    genres.sort(function (a, b) { return a.localeCompare(b, 'ja'); });

    el.genreDatalist.innerHTML = genres.map(function (g) {
      return '<option value="' + escapeHtml(g) + '"></option>';
    }).join('');

    var prevSelected = el.genreFilter.value;
    var options = ['<option value="">ジャンル: すべて</option>'].concat(
      genres.map(function (g) { return '<option value="' + escapeHtml(g) + '">' + escapeHtml(g) + '</option>'; })
    );
    el.genreFilter.innerHTML = options.join('');
    if (genres.indexOf(prevSelected) !== -1) el.genreFilter.value = prevSelected;
  }

  function renderRows() {
    var filtered = getFiltered();
    var term = el.searchInput.value.trim();
    var hasActiveFilter = term !== '' || el.genreFilter.value !== '' || el.statusFilter.value !== '';

    if (state.quizzes.length === 0) {
      el.listRows.innerHTML =
        '<div class="qm-empty">' +
        '<div class="qm-empty-title">まだ問題がありません</div>' +
        '<p>CSVを読み込むか、「作成」タブから問題を追加してください。</p>' +
        '<div class="qm-empty-actions">' +
        '<button class="qm-btn qm-btn-primary" type="button" data-action="empty-load">⭱ CSVを読み込む</button>' +
        '<button class="qm-btn" type="button" data-action="empty-create">✎ 作成タブへ</button>' +
        '</div></div>';
      return;
    }
    if (filtered.length === 0) {
      el.listRows.innerHTML = hasActiveFilter
        ? '<div class="qm-empty"><p>条件に一致する問題は見つかりませんでした。</p></div>'
        : '<div class="qm-empty"><p>問題が見つかりませんでした。</p></div>';
      return;
    }

    var html = '<div class="qm-rows">';
    filtered.forEach(function (quiz) {
      var num = state.quizzes.findIndex(function (q) { return q.id === quiz.id; }) + 1;
      var isEditing = state.editingId === quiz.id;
      var status = quiz.status || STATUS_OPTIONS[0];
      html += '<div class="qm-row" data-id="' + quiz.id + '">';
      html += '<div class="qm-num">' + num + '</div>';
      html += '<div class="qm-row-content">';
      if (isEditing) {
        html +=
          '<div class="qm-field"><label class="qm-label">問題文</label>' +
          '<textarea class="qm-textarea qm-edit-question" rows="3">' + escapeHtml(quiz.question) + '</textarea></div>' +
          '<div class="qm-field" style="margin-bottom:16px;"><label class="qm-label">答え</label>' +
          '<input class="qm-input qm-edit-answer" value="' + escapeHtml(quiz.answer) + '" /></div>' +
          '<div class="qm-field-row" style="margin-bottom:0;">' +
          '<div class="qm-field"><label class="qm-label">ジャンル</label>' +
          '<input class="qm-input qm-edit-genre" list="genre-datalist" value="' + escapeHtml(quiz.genre || '') + '" /></div>' +
          '<div class="qm-field"><label class="qm-label">ステータス</label>' +
          '<select class="qm-input qm-edit-status">' +
          STATUS_OPTIONS.map(function (opt) {
            return '<option value="' + opt + '"' + (opt === status ? ' selected' : '') + '>' + opt + '</option>';
          }).join('') +
          '</select></div></div>';
      } else {
        html += '<div class="qm-q-text">' + escapeHtml(quiz.question) + '</div>' +
          '<div class="qm-badges">' +
          '<span class="qm-a-pill">答え: ' + escapeHtml(quiz.answer) + '</span>' +
          '<span class="qm-genre-badge">' + escapeHtml(quiz.genre ? quiz.genre : '未分類') + '</span>' +
          '<span class="qm-status-badge ' + statusClass(status) + '">' + escapeHtml(status) + '</span>' +
          '</div>';
      }
      html += '</div>';
      html += '<div class="qm-row-actions">';
      if (isEditing) {
        html +=
          '<button class="qm-icon-btn" type="button" data-action="save-row" aria-label="保存">✓</button>' +
          '<button class="qm-icon-btn" type="button" data-action="cancel-row" aria-label="キャンセル">✕</button>';
      } else {
        html +=
          '<button class="qm-icon-btn" type="button" data-action="edit-row" aria-label="編集">✎</button>' +
          '<button class="qm-icon-btn danger" type="button" data-action="delete-row" aria-label="削除">🗑</button>';
      }
      html += '</div></div>';
    });
    html += '</div>';
    el.listRows.innerHTML = html;
  }

  // ---- preview (create tab) ----
  function renderPreview() {
    if (state.quizzes.length === 0) { el.createPreview.innerHTML = ''; return; }
    var html = '<div class="qm-preview"><div class="qm-preview-title">追加済み（' + state.quizzes.length + '問）</div>';
    state.quizzes.forEach(function (q, i) {
      html += '<div class="qm-preview-row" data-id="' + q.id + '">' +
        '<span class="qm-preview-num">' + (i + 1) + '</span>' +
        '<span class="qm-preview-q">' + escapeHtml(q.question) + '</span>' +
        '<span class="qm-preview-a">' + escapeHtml(q.answer) + '</span>' +
        '<button class="qm-icon-btn danger qm-icon-btn-sm" type="button" data-action="delete-preview" aria-label="削除">✕</button>' +
        '</div>';
    });
    html += '</div>';
    el.createPreview.innerHTML = html;
  }

  // ---- confirm modal ----
  function renderModal() {
    if (!state.confirmAction) { el.modalRoot.innerHTML = ''; return; }
    var isDelete = state.confirmAction.type === 'delete';
    el.modalRoot.innerHTML =
      '<div class="qm-modal-backdrop" data-action="modal-cancel">' +
      '<div class="qm-modal" data-stop="1">' +
      '<div class="qm-modal-title">' + (isDelete ? '問題を削除しますか？' : '新しいCSVを作成しますか？') + '</div>' +
      '<div class="qm-modal-text">' + (isDelete ? 'この操作は取り消せません。' : '現在の一覧はクリアされます。保存していない変更は失われます。') + '</div>' +
      '<div class="qm-modal-actions">' +
      '<button class="qm-btn" type="button" data-action="modal-cancel">キャンセル</button>' +
      '<button class="qm-btn qm-btn-primary" type="button" data-action="modal-confirm">' + (isDelete ? '削除する' : '作成する') + '</button>' +
      '</div></div></div>';
  }

  function renderAll() {
    renderTabs();
    renderStatus();
    renderCount();
    renderGenreOptions();
    renderRows();
    renderPreview();
    renderModal();
  }

  // ---- mutations ----
  function addQuiz(question, answer, genre, status) {
    state.quizzes.push({ id: genId(), question: question, answer: answer, genre: genre || '', status: status || STATUS_OPTIONS[0] });
    saveToStorage();
    renderCount();
    renderGenreOptions();
    renderRows();
    renderPreview();
  }
  function deleteQuiz(id) {
    state.quizzes = state.quizzes.filter(function (q) { return q.id !== id; });
    if (state.editingId === id) state.editingId = null;
    saveToStorage();
    renderCount();
    renderGenreOptions();
    renderRows();
    renderPreview();
  }
  function updateQuiz(id, question, answer, genre, status) {
    state.quizzes = state.quizzes.map(function (q) {
      return q.id === id ? { id: id, question: question, answer: answer, genre: genre || '', status: status || STATUS_OPTIONS[0] } : q;
    });
    saveToStorage();
    renderGenreOptions();
    renderRows();
    renderPreview();
  }
  function resetQuizzes() {
    state.quizzes = [];
    state.editingId = null;
    el.filenameInput.value = 'quiz';
    saveToStorage();
    renderCount();
    renderGenreOptions();
    renderRows();
    renderPreview();
  }

  // ---- event wiring ----
  el.tabListBtn.addEventListener('click', function () { setActiveTab('list'); });
  el.tabCreateBtn.addEventListener('click', function () { setActiveTab('create'); });

  el.loadBtn.addEventListener('click', function () { el.fileInput.click(); });

  el.newBtn.addEventListener('click', function () {
    if (state.quizzes.length > 0) {
      state.confirmAction = { type: 'new' };
      renderModal();
    } else {
      resetQuizzes();
      setActiveTab('create');
      showStatus('success', '新しいCSVを作成しました。問題を追加してください。');
    }
  });

  el.exportBtn.addEventListener('click', function () {
    if (state.quizzes.length === 0) {
      showStatus('error', 'エクスポートする問題がありません。');
      return;
    }
    var rows = [['question', 'answer', 'genre', 'status']].concat(
      state.quizzes.map(function (q) { return [q.question, q.answer, q.genre || '', q.status || STATUS_OPTIONS[0]]; })
    );
    var csv = unparseCSV(rows);
    var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var name = el.filenameInput.value.trim() || 'quiz';
    a.href = url;
    a.download = name + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showStatus('success', 'CSVをエクスポートしました。');
  });

  // ---- CSV file loading (supports one or many files, merging them together) ----
  function readFileAsText(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function (e) { resolve({ name: file.name, text: String(e.target.result || '') }); };
      reader.onerror = function () { reject(new Error('read failed: ' + file.name)); };
      reader.readAsText(file, 'utf-8');
    });
  }

  function detectColumnMap(headerRow) {
    var map = {};
    var lower = headerRow.map(function (c) { return (c == null ? '' : c).toString().trim().toLowerCase(); });
    lower.forEach(function (cell, idx) {
      if (map.question === undefined && QUESTION_TOKENS.indexOf(cell) !== -1) map.question = idx;
      else if (map.answer === undefined && ANSWER_TOKENS.indexOf(cell) !== -1) map.answer = idx;
      else if (map.genre === undefined && GENRE_TOKENS.indexOf(cell) !== -1) map.genre = idx;
      else if (map.status === undefined && STATUS_TOKENS.indexOf(cell) !== -1) map.status = idx;
    });
    return map;
  }

  function csvRowsToQuizzes(text) {
    var rows = parseCSV(text.trim());
    if (!rows || rows.length === 0) return [];

    var headerMap = detectColumnMap(rows[0]);
    var isHeader = headerMap.question !== undefined && headerMap.answer !== undefined;
    var dataRows = isHeader ? rows.slice(1) : rows;

    var qIdx = isHeader ? headerMap.question : 0;
    var aIdx = isHeader ? headerMap.answer : 1;
    var gIdx = isHeader ? headerMap.genre : 2;
    var sIdx = isHeader ? headerMap.status : 3;

    return dataRows
      .filter(function (r) { return Array.isArray(r) && (r[qIdx] == null ? '' : r[qIdx]).toString().trim() !== ''; })
      .map(function (r) {
        var rawStatus = (sIdx !== undefined && r[sIdx] != null) ? r[sIdx].toString().trim() : '';
        var status = STATUS_OPTIONS.indexOf(rawStatus) !== -1 ? rawStatus : STATUS_OPTIONS[0];
        var genre = (gIdx !== undefined && r[gIdx] != null) ? r[gIdx].toString().trim() : '';
        return {
          id: genId(),
          question: (r[qIdx] == null ? '' : r[qIdx]).toString().trim(),
          answer: (r[aIdx] == null ? '' : r[aIdx]).toString().trim(),
          genre: genre,
          status: status
        };
      });
  }

  function processFiles(fileList) {
    var allFiles = Array.prototype.slice.call(fileList || []);
    var files = allFiles.filter(function (f) {
      return /\.csv$/i.test(f.name) || f.type === 'text/csv' || f.type === '';
    });
    if (files.length === 0) {
      showStatus('error', 'CSVファイルが見つかりませんでした。');
      return;
    }

    Promise.all(files.map(readFileAsText)).then(function (results) {
      var merged = [];
      var emptyFiles = [];
      results.forEach(function (r) {
        var quizzes = csvRowsToQuizzes(r.text);
        if (quizzes.length === 0) emptyFiles.push(r.name);
        merged = merged.concat(quizzes);
      });

      if (merged.length === 0) {
        showStatus('error', '有効な問題データが見つかりませんでした。');
        return;
      }

      state.quizzes = merged;
      state.editingId = null;
      el.filenameInput.value = files.length === 1 ? files[0].name.replace(/\.csv$/i, '') : 'merged';
      saveToStorage();
      renderCount();
      renderGenreOptions();
      renderRows();
      renderPreview();
      setActiveTab('list');

      var msg = files.length > 1
        ? files.length + '個のCSVファイルを統合し、合計' + merged.length + '問を読み込みました。'
        : merged.length + '問を読み込みました。';
      if (emptyFiles.length > 0) {
        msg += '（' + emptyFiles.join('、') + ' には有効なデータがありませんでした）';
      }
      showStatus('success', msg);
    }).catch(function () {
      showStatus('error', 'CSVの読み込み中にエラーが発生しました。');
    });
  }

  el.fileInput.addEventListener('change', function (event) {
    var files = event.target.files;
    event.target.value = '';
    if (!files || files.length === 0) return;
    processFiles(files);
  });

  // ---- drag & drop: dropping one or more CSV files anywhere on the page ----
  var dragDepth = 0;
  function setDropOverlay(visible) {
    el.dropOverlay.classList.toggle('qm-hidden', !visible);
  }
  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  document.addEventListener('dragenter', function (e) {
    e.preventDefault();
    var types = (e.dataTransfer && e.dataTransfer.types) || [];
    if (Array.prototype.indexOf.call(types, 'Files') !== -1) {
      dragDepth++;
      setDropOverlay(true);
    }
  });
  document.addEventListener('dragleave', function (e) {
    e.preventDefault();
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) setDropOverlay(false);
  });
  document.addEventListener('drop', function (e) {
    e.preventDefault();
    dragDepth = 0;
    setDropOverlay(false);
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      processFiles(e.dataTransfer.files);
    }
  });

  el.searchInput.addEventListener('input', function () { renderRows(); });
  el.genreFilter.addEventListener('change', function () { renderRows(); });
  el.statusFilter.addEventListener('change', function () { renderRows(); });

  el.addForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var q = el.formQuestion.value.trim();
    var a = el.formAnswer.value.trim();
    var g = el.formGenre.value.trim();
    var s = el.formStatus.value;
    if (!q || !a) {
      showStatus('error', '問題文と答えの両方を入力してください。');
      return;
    }
    addQuiz(q, a, g, s);
    el.formQuestion.value = '';
    el.formAnswer.value = '';
    el.formQuestion.focus();
    showStatus('success', '問題を追加しました。');
  });

  // delegated clicks: list rows
  el.listRows.addEventListener('click', function (e) {
    var actionEl = e.target.closest('[data-action]');
    if (!actionEl) return;
    var action = actionEl.getAttribute('data-action');
    var rowEl = e.target.closest('[data-id]');
    var id = rowEl ? rowEl.getAttribute('data-id') : null;

    if (action === 'empty-load') { el.fileInput.click(); }
    else if (action === 'empty-create') { setActiveTab('create'); }
    else if (action === 'edit-row') {
      state.editingId = id;
      renderRows();
    } else if (action === 'cancel-row') {
      state.editingId = null;
      renderRows();
    } else if (action === 'save-row') {
      var qEl = rowEl.querySelector('.qm-edit-question');
      var aEl = rowEl.querySelector('.qm-edit-answer');
      var gEl = rowEl.querySelector('.qm-edit-genre');
      var sEl = rowEl.querySelector('.qm-edit-status');
      var q = qEl.value.trim();
      var a = aEl.value.trim();
      var g = gEl.value.trim();
      var s = sEl.value;
      if (!q || !a) {
        showStatus('error', '問題文と答えの両方を入力してください。');
        return;
      }
      state.editingId = null;
      updateQuiz(id, q, a, g, s);
      showStatus('success', '更新しました。');
    } else if (action === 'delete-row') {
      state.confirmAction = { type: 'delete', id: id };
      renderModal();
    }
  });

  // delegated clicks: preview list (create tab)
  el.createPreview.addEventListener('click', function (e) {
    var actionEl = e.target.closest('[data-action="delete-preview"]');
    if (!actionEl) return;
    var rowEl = e.target.closest('[data-id]');
    var id = rowEl ? rowEl.getAttribute('data-id') : null;
    state.confirmAction = { type: 'delete', id: id };
    renderModal();
  });

  // status close
  el.statusArea.addEventListener('click', function (e) {
    if (e.target.closest('[data-action="close-status"]')) {
      if (statusTimer) clearTimeout(statusTimer);
      state.status = null;
      renderStatus();
    }
  });

  // modal
  el.modalRoot.addEventListener('click', function (e) {
    var stopEl = e.target.closest('[data-stop]');
    if (stopEl && e.target === stopEl) return; // clicked inside modal box itself, not backdrop
    var actionEl = e.target.closest('[data-action]');
    if (!actionEl) return;
    var action = actionEl.getAttribute('data-action');
    if (action === 'modal-cancel') {
      state.confirmAction = null;
      renderModal();
    } else if (action === 'modal-confirm') {
      if (state.confirmAction.type === 'delete') {
        deleteQuiz(state.confirmAction.id);
        showStatus('success', '削除しました。');
      } else if (state.confirmAction.type === 'new') {
        resetQuizzes();
        setActiveTab('create');
        showStatus('success', '新しいCSVを作成しました。問題を追加してください。');
      }
      state.confirmAction = null;
      renderModal();
    }
  });

  // stop propagation for clicks inside the modal box (so backdrop handler doesn't close it)
  el.modalRoot.addEventListener('click', function (e) {
    if (e.target.closest('.qm-modal') && !e.target.closest('[data-action]')) {
      e.stopPropagation();
    }
  }, true);

  // ---- init ----
  loadFromStorage();
  renderAll();
})();
</script>
</body>
</html>
